[env:esp32-s3-zero]
    platform = espressif32
    framework = arduino
    ; ESP32-S3 DevKitC-1 보드 프로파일을 사용합니다. 
    board = esp32-s3-devkitc-1 

    board_build.f_cpu = 240000000L
    board_build.f_flash = 80000000L
    board_build.flash_mode = qio

    board_upload.flash_size = 4MB
    board_build.partitions = default_4MB.csv 

    ; 오버클럭된 코어를 사용하는 경우 240MHz로 설정합니다.
    board_build.mcu = esp32s3
    monitor_speed = 115200


    lib_deps = 
        bblanchon/ArduinoJson @ ^7.4.2
        esp32async/ESPAsyncWebServer@^3.8.0     #me-no-dev/ESP Async WebServer@^1.2.3
        #me-no-dev/AsyncTCP@^1.1.1
    board_build.filesystem = littlefs 
    
    build_unflags = -std=gnu++11
    ; 빌드 플래그 (일반적으로 사용하지 않아도 되지만, 디버깅 등에 유용)
    build_flags = 
        -DBOARD_HAS_PSRAM
        -mfix-esp32-psram-cache-issue
        -DARDUINO_USB_CDC_ON_BOOT=1 ; USB CDC 활성화 (USB 네이티브 포트 사용 시)
        -std=gnu++17

        
        ; WDT 비활성화 (권장하지 않음)
        ;-D CONFIG_FREERTOS_WATCHDOG_CPU_ID=0
        ;-D CONFIG_TASK_WDT_CHECK_IDLE_TASK=n
