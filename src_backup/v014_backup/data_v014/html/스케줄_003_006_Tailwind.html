<!-- 스케줄_003_006_Tailwind.html -->

<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Smart Wind 스케줄 관리</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" href="스케줄_003_006_Tailwind.css">
</head>

<body class="p-4 sm:p-8">
	<div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col items-end space-y-2"></div>
	<div id="loadingOverlay" class="fixed inset-0 bg-white/70 flex items-center justify-center z-40 hidden">
		<div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-blue-500"></div>
	</div>

	<div class="max-w-5xl mx-auto space-y-6">
		<header class="flex justify-between items-center pb-4 border-b">
			<h1 class="text-2xl font-extrabold text-gray-800">
				<span class="text-blue-600">📅</span> Smart Wind 스케줄 관리
			</h1>
			<div class="flex space-x-2">
				<span id="authStatus" class="text-sm text-gray-500 flex items-center">
					<span class="h-2 w-2 rounded-full bg-red-400 mr-1 animate-pulse"></span>
					인증 중...
				</span>
				<button id="btnRefresh"
					class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-lg transition">
					새로고침
				</button>
				<button id="btnAddNewSchedule"
					class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition"
					disabled>
					추가+
				</button>
			</div>
		</header>

		<section id="scheduleListSection" class="card bg-white p-6 rounded-xl border border-gray-200">
			<h2 class="text-xl font-bold text-gray-700 mb-4">스케줄 목록 (<span id="scheduleCount">0</span>개)</h2>
			<div id="scheduleListContainer" class="border rounded-lg overflow-hidden">
				<div id="listPlaceholder" class="p-8 text-center text-gray-500">스케줄을 로드 중입니다.</div>
			</div>
			<div class="mt-4 p-2 bg-gray-100 rounded-lg text-sm text-gray-600">
				사용자 ID: <code id="displayUserId" class="font-mono text-xs select-all">N/A</code>
			</div>
		</section>

		<section id="scheduleDetailSection" class="card bg-white p-6 rounded-xl border border-gray-200 hidden">
			<header class="flex justify-between items-center mb-4 border-b pb-2">
				<h2 class="text-xl font-bold text-blue-600">스케줄 편집 (<span id="detailTitle">새 항목</span>)</h2>
				<div class="space-x-2">
					<button id="btnCancelEdit"
						class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-lg transition">
						취소
					</button>
					<button id="btnDeleteSchedule"
						class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg transition hidden">
						삭제
					</button>
					<button id="btnSaveDetail"
						class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition">
						저장
					</button>
				</div>
			</header>

			<div class="mt-4">
				<h3 class="text-lg font-semibold text-gray-700 mb-3 border-l-2 border-green-500 pl-2">기본 정보 및 기간</h3>
				<div class="grid grid-cols-1 md:grid-cols-4 gap-4">
					<div class="md:col-span-1">
						<label class="block text-sm font-medium text-gray-700 mb-1">스케줄 번호 (1-999)</label>
						<input type="number" id="schNoDetail" min="1" max="999" class="input-text">
					</div>
					<div class="md:col-span-2">
						<label class="block text-sm font-medium text-gray-700 mb-1">스케줄 이름</label>
						<div class="flex space-x-2">
							<input type="text" id="scheduleNameDetail" class="input-text flex-grow">
							<button id="btnSuggestName"
								class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-3 rounded-lg text-sm transition disabled:bg-purple-400"
								disabled>
								✨ 이름 추천
							</button>
						</div>
					</div>
					<div class="md:col-span-1 flex items-end">
						<label class="inline-flex items-center">
							<input type="checkbox" id="scheduleEnabledDetail"
								class="form-checkbox h-5 w-5 text-blue-600 rounded">
							<span class="ml-2 text-sm font-medium text-gray-700">스케줄 사용 여부</span>
						</label>
					</div>
				</div>

				<div class="mt-6 border-t pt-4">
					<div class="flex items-start">
						<label class="inline-flex items-center">
							<input type="checkbox" id="periodEnabledDetail"
								class="form-checkbox h-5 w-5 text-blue-600 rounded">
							<span class="ml-2 text-sm font-medium text-gray-700">동작 시간대 Rule 적용 여부</span>
						</label>
					</div>
					<div id="periodSettingsContainer"
						class="mt-4 grid grid-cols-1 md:grid-cols-4 gap-4 transition-all duration-300">
						<div id="startTimeContainer" class="md:col-span-1">
							<label class="block text-sm font-medium text-gray-700 mb-1">시작 시간 (HH:MM)</label>
							<input type="time" id="startTimeDetail" class="input-text" value="08:00">
						</div>
						<div id="endTimeContainer" class="md:col-span-1">
							<label class="block text-sm font-medium text-gray-700 mb-1">종료 시간 (HH:MM)</label>
							<input type="time" id="endTimeDetail" class="input-text" value="18:00">
						</div>
						<div class="md:col-span-4 mt-2">
							<label class="block text-sm font-medium text-gray-700 mb-2">동작 요일</label>
							<div id="daySelectorsDetail" class="flex flex-wrap gap-2">
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="mt-6 border-t pt-4">
				<div class="flex justify-between items-center mb-3">
					<h3 class="text-lg font-semibold text-gray-700 border-l-2 border-green-500 pl-2">동작 단계 (Step)</h3>
					<button id="btnAddSegmentDetail"
						class="bg-green-500 hover:bg-green-600 text-white py-1 px-3 text-sm rounded transition">
						+ 동작 단계(Step) 추가
					</button>
				</div>
				<div id="segmentListDetail" class="space-y-3">
				</div>
			</div>

			<div class="mt-6 border-t pt-4">
				<h3 class="text-lg font-semibold text-gray-700 mb-3 border-l-2 border-green-500 pl-2">자동 종료 및 움직임 감지
				</h3>
				<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-4">

					<div>
						<h4 class="font-semibold text-gray-600 mb-2">자동 종료 (AutoOff)</h4>
						<div class="space-y-3">
							<label class="inline-flex items-center ml-2">
								<input type="checkbox" id="autoOffTimerEnabledDetail"
									class="form-checkbox h-4 w-4 text-blue-600 rounded autooff-toggle">
								<span class="ml-1 text-sm font-medium text-gray-700">작동 타이머 적용</span>
							</label>
							<div class="autooff-group timer-group hidden">
								<label class="block text-sm font-medium text-gray-700">작동 시간 (분)</label>
								<input type="number" id="autoOffTimerMinutesDetail" min="0"
									class="input-text inline-block w-full autooff-input-timer" value="0">
							</div>

							<label class="inline-flex items-center ml-2">
								<input type="checkbox" id="autoOffOffTimeEnabledDetail"
									class="form-checkbox h-4 w-4 text-blue-600 rounded autooff-toggle">
								<span class="ml-1 text-sm font-medium text-gray-700">종료 시각 적용</span>
							</label>
							<div class="autooff-group offtime-group hidden">
								<label class="block text-sm font-medium text-gray-700">시간 (HH:MM)</label>
								<input type="time" id="autoOffOffTimeDetail"
									class="input-text inline-block w-full autooff-input-offtime" value="23:59">
							</div>

							<label class="inline-flex items-center ml-2">
								<input type="checkbox" id="autoOffOffTempEnabledDetail"
									class="form-checkbox h-4 w-4 text-blue-600 rounded autooff-toggle">
								<span class="ml-1 text-sm font-medium text-gray-700">종료 온도 적용</span>
							</label>
							<div class="autooff-group offtemp-group hidden">
								<label class="block text-sm font-medium text-gray-700">온도 미만 (°C)</label>
								<input type="number" id="autoOffOffTempDetail" min="0" step="0.1"
									class="input-text inline-block w-full autooff-input-offtemp" value="0.0">
							</div>
						</div>
					</div>

					<div class="md:col-span-2">
						<h4 class="font-semibold text-gray-600 mb-2">움직임 감지 (Motion) 작동 Rule</h4>
						<div class="grid grid-cols-2 gap-4">

							<div class="space-y-3 p-3 bg-gray-50 rounded-lg">
								<h5 class="font-medium text-sm text-gray-800">적외선</h5>
								<label class="inline-flex items-center text-sm">
									<input type="checkbox" id="motionPirEnabledDetail"
										class="form-checkbox h-4 w-4 text-blue-600 rounded motion-toggle-pir">
									<span class="ml-2">적외선 감지 적용</span>
								</label>
								<div class="motion-group pir-group hidden">
									<label class="block text-xs text-gray-600">감지 시 작동 시간 (초)</label>
									<input type="number" id="motionPirHoldSecDetail" min="0"
										class="input-text text-sm motion-input-pir" value="0">
								</div>
							</div>

							<div class="space-y-3 p-3 bg-gray-50 rounded-lg">
								<h5 class="font-medium text-sm text-gray-800">블루투스 디바이스</h5>
								<label class="inline-flex items-center text-sm">
									<input type="checkbox" id="motionBleEnabledDetail"
										class="form-checkbox h-4 w-4 text-blue-600 rounded motion-toggle-ble">
									<span class="ml-2">블루투스 감지 적용</span>
								</label>
								<div class="motion-group ble-group hidden">
									<label class="block text-xs text-gray-600">신호(RSSI) 임계값 (dBm)</label>
									<input type="number" id="motionBleRssiThresholdDetail" min="-100" max="-30"
										class="input-text text-sm motion-input-ble" value="-70">
									<label class="block text-xs text-gray-600">감지 시 작동 시간 (초)</label>
									<input type="number" id="motionBleHoldSecDetail" min="0"
										class="input-text text-sm motion-input-ble" value="0">
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>

	</div>

	<script type="module" src="스케줄_003_006_Tailwind.js"></script>
</body>

</html>
