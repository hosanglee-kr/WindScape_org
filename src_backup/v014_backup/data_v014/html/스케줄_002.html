<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Wind 스케줄 관리 및 편집</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', 'Pretendard', sans-serif; background-color: #f4f7f9; }
        .card { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06); }
        .input-text, .input-select {
            @apply w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500;
        }
        .segment-card {
            @apply border-l-4 border-l-blue-400 p-4 bg-white rounded-lg shadow-md mb-4;
        }
        .day-toggle input:checked + span {
            @apply bg-blue-600 text-white shadow-md;
        }
        .schedule-item {
            @apply flex justify-between items-center p-4 bg-white border-b hover:bg-gray-50 cursor-pointer transition;
        }
    </style>
</head>
<body class="p-4 sm:p-8">
    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col items-end space-y-2"></div>
    <div id="loadingOverlay" class="fixed inset-0 bg-white/70 flex items-center justify-center z-40 hidden">
        <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-blue-500"></div>
    </div>
    
    <div class="max-w-5xl mx-auto space-y-6">
        <header class="flex justify-between items-center pb-4 border-b">
            <h1 class="text-2xl font-extrabold text-gray-800">
                <span class="text-blue-600">📅</span> 스케줄 관리
            </h1>
            <div class="flex space-x-2">
                <button id="btnRefresh" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-lg transition">
                    목록 새로고침
                </button>
                <button id="btnAddNewSchedule" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition">
                    + 새 스케줄 추가
                </button>
            </div>
        </header>

        <!-- 1. 스케줄 목록 (목록 모드) -->
        <section id="scheduleListSection" class="card bg-white p-6 rounded-xl border border-gray-200">
            <h2 class="text-xl font-bold text-gray-700 mb-4">등록된 스케줄 목록 (<span id="scheduleCount">0</span>개)</h2>
            <div id="scheduleListContainer" class="border rounded-lg overflow-hidden">
                <div id="listPlaceholder" class="p-8 text-center text-gray-500">스케줄을 로드 중입니다.</div>
            </div>
        </section>

        <!-- 2. 스케줄 세부 편집 (편집 모드) -->
        <section id="scheduleDetailSection" class="card bg-white p-6 rounded-xl border border-gray-200 hidden">
            <header class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-xl font-bold text-red-600">스케줄 편집 (<span id="detailTitle">새 항목</span>)</h2>
                <div class="space-x-2">
                    <button id="btnCancelEdit" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-lg transition">
                        취소
                    </button>
                    <button id="btnDeleteSchedule" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg transition hidden">
                        삭제
                    </button>
                    <button id="btnSaveDetail" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition">
                        세부 저장
                    </button>
                </div>
            </header>

            <!-- A. 기본 설정 및 기간 -->
            <div class="mt-4">
                <h3 class="text-lg font-semibold text-gray-700 mb-3 border-l-2 border-green-500 pl-2">기본 정보 및 기간</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="md:col-span-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">번호</label>
                        <input type="number" id="schNoDetail" class="input-text bg-gray-100 cursor-not-allowed" readonly>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">이름</label>
                        <input type="text" id="scheduleNameDetail" class="input-text">
                    </div>
                    <div class="md:col-span-1 flex items-end">
                        <label class="inline-flex items-center">
                            <input type="checkbox" id="scheduleEnabledDetail" class="form-checkbox h-5 w-5 text-blue-600 rounded">
                            <span class="ml-2 text-sm font-medium text-gray-700">스케줄 활성화</span>
                        </label>
                    </div>
                </div>

                <div class="mt-6 border-t pt-4 grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="md:col-span-1 flex items-start pt-2">
                        <label class="inline-flex items-center">
                            <input type="checkbox" id="periodEnabledDetail" class="form-checkbox h-5 w-5 text-blue-600 rounded">
                            <span class="ml-2 text-sm font-medium text-gray-700">기간 제한 사용</span>
                        </label>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">시작 시간 (HH:MM)</label>
                        <input type="time" id="startTimeDetail" class="input-text">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">종료 시간 (HH:MM)</label>
                        <input type="time" id="endTimeDetail" class="input-text">
                    </div>
                    <div class="md:col-span-4 mt-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">실행 요일 선택</label>
                        <div id="daySelectorsDetail" class="flex flex-wrap gap-2 day-toggle">
                            <!-- Day buttons generated here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- B. 세그먼트 시퀀스 설정 -->
            <div class="mt-6 border-t pt-4">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-lg font-semibold text-gray-700 border-l-2 border-green-500 pl-2">세그먼트 시퀀스</h3>
                    <button id="btnAddSegmentDetail" class="bg-green-500 hover:bg-green-600 text-white py-1 px-3 text-sm rounded transition">
                        + 세그먼트 추가
                    </button>
                </div>
                <div id="segmentListDetail" class="space-y-3">
                    <!-- Segments will be rendered here -->
                </div>
            </div>

            <!-- C. AutoOff 및 Motion 설정 -->
            <div class="mt-6 border-t pt-4">
                <h3 class="text-lg font-semibold text-gray-700 mb-3 border-l-2 border-green-500 pl-2">AutoOff / Motion</h3>
                <!-- ... (AutoOff 및 Motion UI는 이전 schedule_detail.html 로직 재사용) ... -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-4">
                
                    <!-- AutoOff 타이머 -->
                    <div>
                        <h4 class="font-semibold text-gray-600 mb-2">자동 종료 (AutoOff)</h4>
                        <div class="space-y-3">
                            <label class="block text-sm font-medium text-gray-700">타이머 (분)</label>
                            <input type="number" id="autoOffTimerMinutesDetail" min="0" class="input-text inline-block w-full">
                            <label class="inline-flex items-center ml-2">
                                <input type="checkbox" id="autoOffTimerEnabledDetail" class="form-checkbox h-4 w-4 text-blue-600 rounded">
                                <span class="ml-1 text-xs">타이머 사용</span>
                            </label>
                            
                            <label class="block text-sm font-medium text-gray-700">종료 시간 (HH:MM)</label>
                            <input type="time" id="autoOffOffTimeDetail" class="input-text inline-block w-full">
                            <label class="inline-flex items-center ml-2">
                                <input type="checkbox" id="autoOffOffTimeEnabledDetail" class="form-checkbox h-4 w-4 text-blue-600 rounded">
                                <span class="ml-1 text-xs">시간 사용</span>
                            </label>

                            <label class="block text-sm font-medium text-gray-700">종료 온도 (°C)</label>
                            <input type="number" id="autoOffOffTempDetail" min="0" step="0.1" class="input-text inline-block w-full">
                            <label class="inline-flex items-center ml-2">
                                <input type="checkbox" id="autoOffOffTempEnabledDetail" class="form-checkbox h-4 w-4 text-blue-600 rounded">
                                <span class="ml-1 text-xs">온도 사용</span>
                            </label>
                        </div>
                    </div>

                    <!-- Motion 설정 -->
                    <div class="md:col-span-2">
                        <h4 class="font-semibold text-gray-600 mb-2">모션 감지 (Motion)</h4>
                        <div class="grid grid-cols-2 gap-4">
                            
                            <div class="space-y-3 p-3 bg-gray-50 rounded-lg">
                                <h5 class="font-medium text-sm text-gray-800">PIR 설정</h5>
                                <label class="inline-flex items-center text-sm">
                                    <input type="checkbox" id="motionPirEnabledDetail" class="form-checkbox h-4 w-4 text-blue-600 rounded">
                                    <span class="ml-2">PIR 활성화</span>
                                </label>
                                <label class="block text-xs text-gray-600">감지 유지 시간 (초)</label>
                                <input type="number" id="motionPirHoldSecDetail" min="0" class="input-text text-sm">
                            </div>

                            <div class="space-y-3 p-3 bg-gray-50 rounded-lg">
                                <h5 class="font-medium text-sm text-gray-800">BLE 설정</h5>
                                <label class="inline-flex items-center text-sm">
                                    <input type="checkbox" id="motionBleEnabledDetail" class="form-checkbox h-4 w-4 text-blue-600 rounded">
                                    <span class="ml-2">BLE 활성화</span>
                                </label>
                                <label class="block text-xs text-gray-600">RSSI 임계값 (dBm)</label>
                                <input type="number" id="motionBleRssiThresholdDetail" min="-100" max="-30" class="input-text text-sm">
                                <label class="block text-xs text-gray-600">감지 유지 시간 (초)</label>
                                <input type="number" id="motionBleHoldSecDetail" min="0" class="input-text text-sm">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </div>
    
<script>
    // schedule_manager.js (JavaScript Implementation)

    (() => {
        "use strict";

        // Constants and State
        let g_scheduleData = []; // Full array of all schedule items
        let g_editingItemIndex = -1; // Index in g_scheduleData array of the item being edited (-1 means editing a new item)
        let g_presets = []; // Loaded from /api/windProfile
        const DAY_NAMES = ['월', '화', '수', '목', '금', '토', '일'];
        const DEFAULT_SCHEDULE_ID = 900; // Starting ID for new schedules

        const KEY_API = 'sc10_api_key';
        const API_URL = ""; 
        const $ = (s, r = document) => r.querySelector(s);
        const text = (el, v) => el && (el.textContent = v);
        const getKey = () => localStorage.getItem(KEY_API) || '';
        
        // UI Helpers
        const setLoading = (flag) => {
            const ov = $("#loadingOverlay");
            if (ov) ov.style.display = flag ? "flex" : "none";
        };
        const showToast = (msg, type = "ok") => {
            const cont = $("#toastContainer");
            if (!cont) return;
            const div = document.createElement("div");
            div.className = `p-3 mt-2 rounded-lg text-white text-sm ${type === 'ok' ? 'bg-green-500' : type === 'warn' ? 'bg-amber-500' : 'bg-red-500'}`;
            div.textContent = msg;
            cont.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        };
        
        // --- View Toggling ---
        const showListView = () => {
            $("#scheduleListSection").classList.remove('hidden');
            $("#scheduleDetailSection").classList.add('hidden');
        };

        const showDetailView = () => {
            $("#scheduleListSection").classList.add('hidden');
            $("#scheduleDetailSection").classList.remove('hidden');
        };

        // ======================= Initialization and Loading =======================

        document.addEventListener("DOMContentLoaded", () => {
            bindEvents();
            renderDaySelectors();
            loadAllConfig();
        });

        function renderDaySelectors() {
            const container = $("#daySelectorsDetail");
            DAY_NAMES.forEach((name, index) => {
                // Day index 1=Mon, 2=Tue, ..., 6=Sat, 0=Sun (Standard time.h WDAY)
                const dayValue = index === 6 ? 0 : index + 1; 
                const label = document.createElement('label');
                label.className = 'inline-flex items-center p-2 rounded-lg cursor-pointer transition day-toggle';
                label.innerHTML = `
                    <input type="checkbox" id="day-${dayValue}" data-day-index="${index}" class="hidden form-checkbox h-4 w-4 text-blue-600 rounded">
                    <span class="ml-2 text-sm font-medium p-1 px-3 rounded ${index >= 5 ? 'text-red-500' : 'text-gray-700'}">${name}</span>
                `;
                container.appendChild(label);
            });
        }
        
        async function loadAllConfig() {
            showListView();
            // 1. Load Presets (for segment selection)
            const windData = await fetchApi("/api/windProfile", "GET", null, "프리셋 로드");
            if (windData?.windProfile?.presets) {
                g_presets = windData.windProfile.presets;
            }

            // 2. Load Schedules
            const schData = await fetchApi("/api/schedules", "GET", null, "스케줄 로드");
            if (schData?.schedules) {
                g_scheduleData = schData.schedules;
                renderScheduleList(g_scheduleData);
            }
        }
        
        // ======================= List View (목록) =======================
        
        function renderScheduleList(schedules) {
            const container = $("#scheduleListContainer");
            container.innerHTML = '';
            text($("#scheduleCount"), schedules.length);
            
            if (schedules.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-gray-500">등록된 스케줄이 없습니다.</div>`;
                return;
            }

            schedules.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'schedule-item';
                div.dataset.index = index;
                
                const enabledClass = item.enabled ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500';
                
                div.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <span class="font-bold text-lg text-gray-800">${item.name} (#${item.schNo})</span>
                        <span class="text-sm font-medium ${enabledClass} px-2 py-0.5 rounded-full">
                            ${item.enabled ? '활성' : '비활성'}
                        </span>
                        <span class="text-xs text-gray-500">${item.period.start_time} - ${item.period.end_time}</span>
                    </div>
                    <div class="space-x-2">
                        <button data-index="${index}" class="btnEdit bg-blue-500 hover:bg-blue-600 text-white text-xs py-1 px-3 rounded transition">
                            편집
                        </button>
                        <button data-index="${index}" class="btnToggleStatus bg-yellow-500 hover:bg-yellow-600 text-white text-xs py-1 px-3 rounded transition">
                            ${item.enabled ? '비활성 처리' : '활성 처리'}
                        </button>
                    </div>
                `;
                
                div.querySelector('.btnEdit').addEventListener('click', () => startEdit(index));
                div.querySelector('.btnToggleStatus').addEventListener('click', (e) => {
                    e.stopPropagation(); // Prevents item click event if implemented
                    toggleScheduleStatus(index);
                });

                container.appendChild(div);
            });
        }
        
        // ======================= Detail View (세부 편집) =======================
        
        function startNewSchedule() {
            const maxSchNo = g_scheduleData.reduce((max, item) => Math.max(max, item.schNo), 0);
            const newSchNo = maxSchNo > 0 ? maxSchNo + 1 : 1;

            const newItem = {
                schNo: newSchNo,
                name: "새 스케줄",
                enabled: true,
                period: { enabled: false, days: [1, 1, 1, 1, 1, 0, 0], start_time: "08:00", end_time: "18:00" },
                seg_count: 0,
                segments: [],
                autoOff: { timer: { enabled: false, minutes: 0 }, offTime: { enabled: false, time: "23:59" }, offTemp: { enabled: false, temp: 0.0 } },
                motion: { pir: { enabled: false, hold_sec: 0 }, ble: { enabled: false, rssi_threshold: -70, hold_sec: 0 } }
            };

            // Add the new item to the data array (unsaved)
            g_scheduleData.push(newItem);
            g_editingItemIndex = g_scheduleData.length - 1;
            renderScheduleDetail(newItem);
            
            // Show Delete button only if it's an existing item being edited
            $("#btnDeleteSchedule").classList.add('hidden');
            showDetailView();
        }

        function startEdit(index) {
            g_editingItemIndex = index;
            const item = g_scheduleData[index];
            renderScheduleDetail(item);
            $("#btnDeleteSchedule").classList.remove('hidden');
            showDetailView();
        }

        function renderScheduleDetail(item) {
            text($("#detailTitle"), `편집: ${item.name}`);
            $("#schNoDetail").value = item.schNo;
            $("#scheduleNameDetail").value = item.name;
            $("#scheduleEnabledDetail").checked = item.enabled;

            // Period
            $("#periodEnabledDetail").checked = item.period.enabled;
            $("#startTimeDetail").value = item.period.start_time;
            $("#endTimeDetail").value = item.period.end_time;
            
            // Days
            document.querySelectorAll('#daySelectorsDetail input[type="checkbox"]').forEach((input, index) => {
                 // item.period.days array is indexed 0=Mon, 1=Tue, ... 6=Sun
                 input.checked = item.period.days[index] === 1;
            });

            // AutoOff
            $("#autoOffTimerEnabledDetail").checked = item.autoOff.timer.enabled;
            $("#autoOffTimerMinutesDetail").value = item.autoOff.timer.minutes;
            $("#autoOffOffTimeEnabledDetail").checked = item.autoOff.offTime.enabled;
            $("#autoOffOffTimeDetail").value = item.autoOff.offTime.time;
            $("#autoOffOffTempEnabledDetail").checked = item.autoOff.offTemp.enabled;
            $("#autoOffOffTempDetail").value = item.autoOff.offTemp.temp;

            // Motion
            $("#motionPirEnabledDetail").checked = item.motion.pir.enabled;
            $("#motionPirHoldSecDetail").value = item.motion.pir.hold_sec;
            $("#motionBleEnabledDetail").checked = item.motion.ble.enabled;
            $("#motionBleRssiThresholdDetail").value = item.motion.ble.rssi_threshold;
            $("#motionBleHoldSecDetail").value = item.motion.ble.hold_sec;

            renderSegmentList(item.segments);
        }
        
        function renderSegmentList(segments) {
            const container = $("#segmentListDetail");
            container.innerHTML = '';
            
            if (segments.length === 0) {
                 container.innerHTML = `<div class="p-4 text-center text-gray-500">세그먼트를 추가해주세요.</div>`;
                return;
            }

            segments.forEach((seg, index) => {
                const segElement = createSegmentElement(seg, index);
                container.appendChild(segElement);
            });
        }
        
        function createSegmentElement(seg, index) {
            // Note: Presets are loaded in g_presets, which is used here
            const div = document.createElement('div');
            div.className = 'segment-card';
            div.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <h4 class="font-bold text-base text-gray-800">Segment ${index + 1} (No: ${seg.segNo})</h4>
                    <button data-index="${index}" class="btnDeleteSegment bg-red-500 hover:bg-red-600 text-white py-1 px-3 text-xs rounded transition">삭제</button>
                </div>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                    <div>
                        <label class="text-xs text-gray-600">ON 시간 (분)</label>
                        <input type="number" data-key="on_minutes" value="${seg.on_minutes}" min="0" class="input-text text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-600">OFF 시간 (분)</label>
                        <input type="number" data-key="off_minutes" value="${seg.off_minutes}" min="0" class="input-text text-sm">
                    </div>
                     <div class="col-span-2 md:col-span-1">
                        <label class="text-xs text-gray-600">모드</label>
                        <select data-key="mode" class="input-select text-sm seg-mode-select">
                            <option value="PRESET">프리셋</option>
                            <option value="FIXED">고정 속도</option>
                        </select>
                    </div>
                     <div class="col-span-2 md:col-span-1">
                        <label class="text-xs text-gray-600">고정속도 (%)</label>
                        <input type="number" data-key="fixed_speed" value="${seg.fixed_speed}" min="0" max="100" step="0.1" class="input-text text-sm">
                    </div>
                </div>

                <div class="preset-details space-y-3 mt-3 p-3 bg-gray-50 rounded-lg">
                    <h5 class="text-sm font-semibold mb-2">프리셋 상세 / 조정 (Adjust)</h5>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs text-gray-600">프리셋 코드</label>
                            <select data-key="presetCode" class="input-select text-sm seg-preset-select"></select>
                        </div>
                        <div>
                            <label class="text-xs text-gray-600">스타일 코드</label>
                            <select data-key="styleCode" class="input-select text-sm seg-style-select">
                                <option value="BALANCE">BALANCE</option>
                                <!-- Styles typically loaded here -->
                            </select>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <label class="text-xs text-gray-600">강도 조정(±)</label>
                        <input type="number" data-key="adjust.wind_intensity" value="${seg.adjust.wind_intensity}" step="0.1" class="input-text text-sm">
                        <label class="text-xs text-gray-600">가변성 조정(±)</label>
                        <input type="number" data-key="adjust.wind_variability" value="${seg.adjust.wind_variability}" step="0.1" class="input-text text-sm">
                        <!-- Adjust fields continue for gust_freq, fan_limit, etc. if implemented -->
                    </div>
                </div>
            `;
            
            // Populate Presets/Styles dropdowns
            const presetSelect = div.querySelector('.seg-preset-select');
            g_presets.forEach(p => {
                 const opt = document.createElement('option');
                 opt.value = p.code;
                 opt.textContent = p.name;
                 presetSelect.appendChild(opt);
            });
            presetSelect.value = seg.presetCode;

            // Set Mode default
            div.querySelector('.seg-mode-select').value = seg.mode;
            
            return div;
        }


        // ======================= Event Handlers =======================

        function bindEvents() {
            $("#btnRefresh")?.addEventListener("click", loadAllConfig);
            $("#btnAddNewSchedule")?.addEventListener("click", startNewSchedule);
            $("#btnCancelEdit")?.addEventListener("click", showListView);
            $("#btnSaveDetail")?.addEventListener("click", saveScheduleDetail);
            $("#btnDeleteSchedule")?.addEventListener("click", deleteSchedule);
            
            // Delegate segment deletion
            $("#segmentListDetail")?.addEventListener('click', (e) => {
                if (e.target.classList.contains('btnDeleteSegment')) {
                    deleteSegment(e.target.dataset.index);
                }
            });
            
            // Segment Add
            $("#btnAddSegmentDetail")?.addEventListener("click", addSegment);
        }
        
        function addSegment() {
            const item = g_scheduleData[g_editingItemIndex];
            if (!item) return showToast("스케줄 편집 모드가 아닙니다.", "err");

            const newSegNo = item.segments.length > 0 ? 
                             Math.max(...item.segments.map(s => s.segNo)) + 1 : 1;
            
            const newSegment = {
                segNo: newSegNo,
                on_minutes: 15,
                off_minutes: 5,
                mode: "PRESET",
                presetCode: g_presets[0]?.code || "OCEAN",
                styleCode: "BALANCE",
                adjust: { wind_intensity: 0.0, wind_variability: 0.0, gust_frequency: 0.0, fan_limit: 0.0, min_fan: 0.0 },
                fixed_speed: 0.0
            };
            
            item.segments.push(newSegment);
            renderSegmentList(item.segments);
        }
        
        function deleteSegment(index) {
            const item = g_scheduleData[g_editingItemIndex];
            if (!item) return;

            const segName = item.segments[index]?.presetCode || 'Segment';

            if (confirm(`Segment ${Number(index) + 1} (${segName})을(를) 삭제하시겠습니까?`)) {
                item.segments.splice(index, 1);
                renderSegmentList(item.segments);
                showToast("세그먼트 삭제됨", "warn");
            }
        }

        // --- Toggle Status (List View) ---
        async function toggleScheduleStatus(index) {
            const item = g_scheduleData[index];
            if (!item) return;
            
            // Prepare PATCH body with only the schNo and the inverse status
            const newStatus = !item.enabled;
            const body = {
                schedules: [{
                    schNo: item.schNo,
                    enabled: newStatus
                }]
            };

            const result = await fetchApi("/api/schedules", "POST", body, `스케줄 상태 변경`);

            if (result && result.updated) {
                // Update local data and re-render the list
                item.enabled = newStatus;
                renderScheduleList(g_scheduleData);
            }
        }
        
        // --- Save Detail Logic ---
        function collectScheduleDetailData(item) {
            // Update local data from Detail UI
            item.name = $("#scheduleNameDetail").value;
            item.enabled = $("#scheduleEnabledDetail").checked;

            // Period
            item.period.enabled = $("#periodEnabledDetail").checked;
            item.period.start_time = $("#startTimeDetail").value;
            item.period.end_time = $("#endTimeDetail").value;
            
            // Days
            document.querySelectorAll('#daySelectorsDetail input[type="checkbox"]').forEach((input, index) => {
                 item.period.days[index] = input.checked ? 1 : 0;
            });
            
            // AutoOff / Motion
            item.autoOff.timer.enabled = $("#autoOffTimerEnabledDetail").checked;
            item.autoOff.timer.minutes = Number($("#autoOffTimerMinutesDetail").value);
            item.autoOff.offTime.enabled = $("#autoOffOffTimeEnabledDetail").checked;
            item.autoOff.offTime.time = $("#autoOffOffTimeDetail").value;
            item.autoOff.offTemp.enabled = $("#autoOffOffTempEnabledDetail").checked;
            item.autoOff.offTemp.temp = Number($("#autoOffOffTempDetail").value);

            item.motion.pir.enabled = $("#motionPirEnabledDetail").checked;
            item.motion.pir.hold_sec = Number($("#motionPirHoldSecDetail").value);
            item.motion.ble.enabled = $("#motionBleEnabledDetail").checked;
            item.motion.ble.rssi_threshold = Number($("#motionBleRssiThresholdDetail").value);
            item.motion.ble.hold_sec = Number($("#motionBleHoldSecDetail").value);

            // Segments (Collect from DOM to update item.segments)
            const segmentsFromDOM = [];
            document.querySelectorAll('#segmentListDetail > .segment-card').forEach(card => {
                const seg = { adjust: {} };
                
                card.querySelectorAll('input, select').forEach(input => {
                    const key = input.dataset.key;
                    if (!key) return;

                    const value = input.type === 'number' ? Number(input.value) : input.value;
                    
                    if (key.startsWith('adjust.')) {
                        const adjustKey = key.split('.')[1];
                        seg.adjust[adjustKey] = value;
                    } else {
                        seg[key] = value;
                    }
                });
                // Assign a temporary segNo if missing (should be present from render)
                if (!seg.segNo) seg.segNo = 0; 
                segmentsFromDOM.push(seg);
            });
            
            item.segments = segmentsFromDOM;
            item.seg_count = segmentsFromDOM.length;
            return item;
        }

        async function saveScheduleDetail() {
            if (g_editingItemIndex === -1 && g_scheduleData.length === 0) return;

            // 1. Collect data from UI and update the item in g_scheduleData
            const itemToSave = g_scheduleData[g_editingItemIndex];
            collectScheduleDetailData(itemToSave);

            // 2. Prepare POST body: Send only the item being edited within the schedules array
            const body = {
                schedules: [itemToSave]
            };

            // 3. Call POST /api/schedules (PATCH/PUT style)
            const result = await fetchApi("/api/schedules", "POST", body, `스케줄 #${itemToSave.schNo} 저장`);

            if (result && result.updated) {
                 showListView(); // Go back to list view on success
                 loadAllConfig(); // Reload the list to ensure synchronization
            }
        }
        
        async function deleteSchedule() {
            if (g_editingItemIndex === -1) return;
            const item = g_scheduleData[g_editingItemIndex];
            
            if (confirm(`스케줄 ${item.name} (#${item.schNo})을(를) 삭제하시겠습니까?`)) {
                // Remove item from local array
                g_scheduleData.splice(g_editingItemIndex, 1);
                
                // Prepare body: Send the entire modified list (full PUT/PATCH with deletion)
                const body = {
                    schedules: g_scheduleData
                };

                const result = await fetchApi("/api/schedules", "POST", body, `스케줄 삭제`);

                if (result && result.updated) {
                    g_editingItemIndex = -1;
                    showListView(); 
                    loadAllConfig(); // Reload and re-render
                } else {
                    showToast("삭제 실패: 서버 응답 오류", "err");
                    // Revert local change if save fails (complex, often skipped in embedded systems)
                }
            }
        }

    })();
</script>
</body>
</html>
