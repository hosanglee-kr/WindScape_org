<!--
 * ------------------------------------------------------
 * 소스명 : SC10_main_016.html
 * 모듈명 : WindScape Configuration Manager (Frontend Shell)
 * ------------------------------------------------------
 * 기능 요약:
 *  - CSS/JS 경로를 /api/web에서 동적으로 조회하여 로드
 *  - 실패 시 기본 경로(/SC10_main_016.css, /SC10_main_016.js)로 Fallback
 * ------------------------------------------------------
 * - 코드 네이밍 규칙(프론트는 참고용):
 *    - 전역 상수/변수: 대문자/낙타표기
 *    - 로컬 변수 : v_
 * ------------------------------------------------------
-->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>자연풍 선풍기 관리자</title>
  <style>
    /* 최소 로더 UI (메인 CSS 로드 전 간이 스타일) */
    html,body{margin:0;padding:0;background:#0f172a;color:#e5e7eb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif}
    .ws-wrap{max-width:1080px;margin:24px auto;padding:0 16px}
    .ws-card{background:#111827;border:1px solid #243047;border-radius:14px;padding:16px}
    .ws-muted{color:#94a3b8}
  </style>
</head>
<body>
  <div class="ws-wrap">
    <div class="ws-card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong>자연풍 선풍기 관리자</strong>
        <span class="ws-muted" id="v_loading">리소스 로딩 중...</span>
      </div>
      <div class="ws-muted" style="margin-top:8px">
        메인 CSS/JS를 설정(/api/web)에서 받아 로딩합니다. 잠시만 기다려주세요.
      </div>
    </div>
  </div>

  <script>
    (function(){
      "use strict";
      const v_fallbackCSS = "/SC10_main_016.css";
      const v_fallbackJS  = "/SC10_main_016.js";

      function v_addCss(p_href){
        const v_l = document.createElement("link");
        v_l.rel  = "stylesheet";
        v_l.href = p_href;
        document.head.appendChild(v_l);
      }
      function v_addJs(p_src){
        return new Promise((resolve, reject)=>{
          const v_s = document.createElement("script");
          v_s.src   = p_src;
          v_s.defer = true;
          v_s.onload = ()=>resolve();
          v_s.onerror= ()=>reject(new Error("JS load failed: "+p_src));
          document.body.appendChild(v_s);
        });
      }
      async function v_boot(){
        try{
          const v_res = await fetch("/api/web");
          if (!v_res.ok) throw new Error("web api http "+v_res.status);
          const v_j = await v_res.json();
          const v_css = (v_j.web && v_j.web.css_file && v_j.web.css_file.uri) ? v_j.web.css_file.uri : v_fallbackCSS;
          const v_js  = (v_j.web && v_j.web.js_file  && v_j.web.js_file.uri ) ? v_j.web.js_file.uri  : v_fallbackJS;

          v_addCss(v_css);
          await v_addJs(v_js);
          document.getElementById("v_loading").textContent = "로딩 완료";
        }catch(e){
          console.warn("[web-loader]", e);
          v_addCss(v_fallbackCSS);
          await v_addJs(v_fallbackJS);
          document.getElementById("v_loading").textContent = "기본 리소스로 로딩됨";
        }
      }
      v_boot();
    })();
  </script>
</body>
</html>
