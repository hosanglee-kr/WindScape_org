<!--
 * ------------------------------------------------------
 * 소스명 : SC10_main_016.html
 * 모듈명 : WindScape Configuration Manager (Frontend Shell)
 * ------------------------------------------------------
 * 기능 요약:
 *  - CSS/JS 경로를 /api/web에서 동적으로 조회하여 로드
 *  - 실패 시 기본 경로(/SC10_main_016.css, /SC10_main_016.js)로 Fallback
 * ------------------------------------------------------
 * - 코드 네이밍 규칙(프론트는 참고용):
 *    - 전역 상수/변수: 대문자/낙타표기
 *    - 로컬 변수 : v_
 * ------------------------------------------------------
-->

<!-- SC10_main_016.html -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🌿 Smart Nature Wind 어댑터 관리자</title>

  <!-- CSS 동적 로딩 -->
  <link id="dynamicCSS" rel="stylesheet" href="">
  <style>
    /* 최소 로딩 스켈레톤 */
    body {
      font-family: Pretendard, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 0;
      color: #333;
      text-align: center;
    }
    #loadingOverlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.85);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      color: #555;
    }
    .spinner {
      width: 42px; height: 42px;
      border: 5px solid #ccc;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div>Smart Nature Wind UI 로딩 중...</div>
  </div>

  <!-- 토스트 메시지 컨테이너 -->
  <div id="toastContainer" style="position:fixed;bottom:12px;right:12px;z-index:1000;"></div>

  <script>
  // ================================================================
  //  Smart Nature Wind Frontend Dynamic Loader
  //  - config.web.* 값 기반으로 JS / CSS 동적 로딩
  // ================================================================
  (async () => {
    try {
      const r = await fetch("/api/web");
      if (!r.ok) throw new Error("/api/web 호출 실패 (" + r.status + ")");
      const j = await r.json();

      const cssUri = j.web?.css_file?.uri || "SC10_main_016.css";
      const jsUri  = j.web?.js_file?.uri  || "SC10_main_016.js";

      // CSS 적용
      const cssEl = document.getElementById("dynamicCSS");
      cssEl.href = cssUri + "?v=" + Date.now();

      // JS 로드
      const jsEl = document.createElement("script");
      jsEl.src = jsUri + "?v=" + Date.now();
      jsEl.defer = true;

      jsEl.onload = () => {
        console.log("[SC10] JS 로드 완료:", jsUri);
        document.getElementById("loadingOverlay").style.display = "none";
      };
      jsEl.onerror = (e) => {
        document.body.innerHTML += `<p style='color:red;'>JS 로드 실패: ${e.message}</p>`;
      };

      document.body.appendChild(jsEl);
    } catch (e) {
      console.error("웹 리소스 로딩 실패:", e);
      document.body.innerHTML = `
        <div style='padding:20px;color:red;'>
          <h3>❌ 리소스 로드 실패</h3>
          <p>/api/web 정보를 불러올 수 없습니다.<br>${e.message}</p>
        </div>`;
    }
  })();
  </script>
</body>
</html>
