name: PlatformIO Secret Config Generator

on:
  push:
    branches:
      - main
  workflow_dispatch: # 수동 실행 가능

jobs:
  generate_config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Config_secret.json in PlatformIO Data Directory
        # Secret 값을 환경 변수로 할당합니다.
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          # platformio.ini의 data_dir 설정과 일치하는 기본 경로
          DATA_DIR: src/v014/data_v014
          # 최종 Secret 파일이 위치할 디렉토리 경로
          TARGET_DIR: src/v014/data_v014/json_secret
          CONFIG_FILE: config_secret.json
          
        run: |
          echo "## Creating target directory: $TARGET_DIR"
          # -p 옵션을 사용하여 상위 디렉토리($DATA_DIR)가 존재하지 않아도 모두 생성합니다.
          mkdir -p $TARGET_DIR
          
          CONFIG_PATH="$TARGET_DIR/$CONFIG_FILE"
          echo "## Generating secret JSON file at: $CONFIG_PATH"
          
          # JSON 문자열을 구성하고 파일로 저장합니다.
          # GitHub Secret ($FIREBASE_KEY, $GEMINI_KEY)이 이 시점에 주입됩니다.
          JSON_CONTENT=$(cat <<EOF
{
"FIREBASE_API_KEY": "$FIREBASE_KEY",
"GEMINI_API_KEY": "$GEMINI_KEY" 
}
EOF
          )
          
          # 구성된 JSON 문자열을 최종 경로에 파일로 저장합니다.
          echo "$JSON_CONTENT" > "$CONFIG_PATH"
          
          # 생성된 파일 내용 확인 (키는 로그에서 자동으로 마스킹됩니다)
          echo "--- Content of $CONFIG_PATH ---"
          cat "$CONFIG_PATH"
          echo "-------------------------------------"

      # 
      # 이 아래에 PlatformIO 빌드 스텝을 추가하여 생성된 파일을 사용할 수 있습니다.
      # 
      - name: PlatformIO Build (Example)
        uses: actions/setup-python@v5
      - name: Install PlatformIO
        run: pip install platformio
      - name: Run PlatformIO Upload/Build
        run: pio run -e esp32-s3-zero
        # PlatformIO는 자동으로 data_dir의 내용을 LittleFS/SPIFFS 이미지에 포함합니다.

