name: Generate Secret Config

on:
  push:
    branches:
      - main
  workflow_dispatch: # 수동 실행을 위한 트리거

jobs:
  generate_config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Config_secret.json
        # Secret 값을 환경 변수로 할당합니다.
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          
        run: |
          echo "## Creating Config_secret.json..."

          # Here document (EOF) 문법을 사용하여 JSON 문자열을 구성합니다.
          # 환경 변수($FIREBASE_KEY, $GEMINI_KEY)가 자동으로 치환됩니다.
          JSON_CONTENT=$(cat <<EOF
{
  "FIREBASE_API_KEY": "$FIREBASE_KEY",
  "GEMINI_API_KEY": "$GEMINI_KEY" 
}
EOF
          )
          
          # 구성된 JSON 문자열을 config_secret.json 파일로 저장합니다.
          echo "$JSON_CONTENT" > config_secret.json
          
          # 파일 생성 확인 및 보안 (키는 GitHub Actions 로그에서 ****로 마스킹되어 보입니다)
          echo "--- Content of Config_secret.json ---"
          cat config_secret.json
          echo "-------------------------------------"
          
      - name: Use the generated file (Example)
        run: |
          echo "Config file generated successfully. Ready for build or deployment."
          # 이후 빌드나 배포 스텝에서 이 파일을 사용합니다.
