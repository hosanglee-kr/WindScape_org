<!doctype html>
<html lang="ko">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>🌬️ Smart Nature Wind 대시보드</title>
	
	<link rel="stylesheet" href="./SC10_common_001.css">
	<link rel="stylesheet" href="./SC10_dashboard_001.css">
</head>

<body>
	
	<header class="nav-bar">
		<div class="nav-container">
			<a href="./SC10_dashboard_001.html" class="nav-logo">Smart Wind 🌬️</a>
			<nav>
				<ul class="nav-menu">
					<li><a href="./SC10_dashboard_001.html" class="active">대시보드</a></li>
					<li><a href="./SC10_chart_006.html">차트 모니터링</a></li>
					<li><a href="./SC10_sim_details_001.html">시뮬 설정</a></li>
					<li><a href="./SC10_profile_001.html">프로파일 관리</a></li>
					<li><a href="./SC10_schedule_001.html">스케줄 관리</a></li>
					<li><a href="./SC10_user_001.html">사용자 프로필</a></li>
					<li><a href="./SC10_settings_001.html">시스템 설정</a></li>
				</ul>
			</nav>
		</div>
	</header>
	
	<div class="wrap">
		<h1>장치 상태 및 핵심 제어</h1>

		<section class="card control-panel">
			<div class="row">
				<strong class="section-title">운영 상태 및 제어</strong>
				<div class="right tight">
					<button class="btn ok" id="btnStartSim">▶ 시뮬레이션 시작</button>
					<button class="btn warn" id="btnStopSim">■ 시뮬레이션 중지</button>
				</div>
			</div>
			
			<div class="grid status-grid">
				
				<div class="col-3 status-card wind-speed-card">
					<label>현재 풍속 (m/s)</label>
					<p id="currentWindSpeed" class="large-value">0.00</p>
				</div>
				
				<div class="col-3 status-card pwm-output-card">
					<label>PWM Duty (%)</label>
					<p id="currentPWMDuty" class="large-value">0</p>
				</div>
				
				<div class="col-3 status-card sim-state-card">
					<label>시뮬레이션 상태</label>
					<p id="simState" class="large-value status-text">OFFLINE</p>
				</div>
				
				<div class="col-3 status-card network-card">
					<label>네트워크</label>
					<p id="networkInfo" class="large-value status-text">AP | 192.168.4.1</p>
				</div>
			</div>
		</section>

		<section class="card logs-panel">
			<div class="row">
				<strong class="section-title">시스템 로그 및 진단 정보</strong>
				<div class="right tight">
					<button class="btn" id="btnDiag">시스템 진단 (Heap/FS)</button>
					<button class="btn" id="btnClearLog">로그 지우기</button>
				</div>
			</div>
			
			<div id="logConsole" class="log-area">
				</div>
		</section>
		
		<div class="muted">© 2540.kr SmartNatureWind (v001 Dashboard UI)</div>
	</div>

	<div id="loadingOverlay" style="display:none;">
		<div class="spinner"></div>
	</div>
	<div id="toastContainer"></div>

	<script src="./SC10_dashboard_001.js" defer></script>
</body>

</html>
