<!--
 * ------------------------------------------------------
 * 소스명 : SC10_main_019.html
 * 모듈명 : Smart Nature Wind Configuration Manager (Frontend Shell)
 * ------------------------------------------------------
 * 기능 요약:
 *  - 정적 경로 고정 로딩 (CSS/JS)
 *  - 상태/설정/파일 업로드 UI
 * ------------------------------------------------------
 * - 코드 네이밍 규칙(프론트는 참고용):
 *    - 전역 상수/변수: 대문자/낙타표기
 *    - 로컬 변수 : v_
 * ------------------------------------------------------
-->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🌿 Smart Nature Wind 관리자</title>
  <link rel="stylesheet" href="./SC10_main_017.css">
</head>
<body>
  <div class="wrap">
    <h1>Smart Nature Wind 관리자 <span class="pill" id="fwVer">…</span></h1>

    <div class="grid">
      <!-- 상태 -->
      <section class="card col-12">
        <div class="row">
          <div class="flex section-title">상태</div>
          <div class="right">
            <button class="btn" id="btnRefresh">새로고침</button>
          </div>
        </div>

        <div class="grid">
          <div class="col-6">
            <div class="row">
              <div><label>시뮬 상태</label><div id="simActive" class="pill">-</div></div>
              <div><label>Phase</label><div id="phase" class="pill">-</div></div>
              <div><label>풍속(m/s)</label><div id="wind" class="pill">-</div></div>
              <div><label>PWM</label><div id="pwm" class="pill">-</div></div>
            </div>
          </div>
          <div class="col-6">
            <div class="row">
              <div><label>Wi-Fi 모드</label><div id="wifiMode" class="pill">-</div></div>
              <div><label>SSID</label><div id="curSsid" class="pill">-</div></div>
              <div><label>IP</label><div id="ip" class="pill">-</div></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 풍속 설정 -->
      <section class="card col-12">
        <div class="row">
          <strong class="section-title">풍속 설정</strong>
          <div class="right tight">
            <button class="btn" id="btnPreviewPreset">미리보기</button>
            <button class="btn ok" id="btnSaveSim">풍속 설정 저장</button>
            <button class="btn ok" id="btnSaveSimInit">풍속 설정 초기화</button>

          </div>
        </div>

        <div class="grid">
          <div class="col-6">
            <label>프리셋</label>
            <select id="preset"></select>
          </div>
          <div class="col-6">
            <div id="presetPreview" class="mt12 muted">프리셋 미리보기: -</div>
          </div>
        </div>

        <div class="grid mt16">
          <div class="col-6"><label>강도 (intensity %)</label><input type="number" id="intensity" min="0" max="200" step="1"></div>
          <div class="col-6"><label>돌풍 빈도 (gust_freq %)</label><input type="number" id="gust_freq" min="0" max="200" step="1"></div>
          <div class="col-6"><label>가변성 (variability %)</label><input type="number" id="variability" min="0" max="100" step="1"></div>
          <div class="col-6"><label>팬 최대 (fan_limit %)</label><input type="number" id="fan_limit" min="0" max="100" step="1"></div>
          <div class="col-6"><label>팬 최소 (min_fan %)</label><input type="number" id="min_fan" min="0" max="100" step="1"></div>
          <div class="col-6"><label>난류 길이 스케일 (turb_len)</label><input type="number" id="turb_len" min="1" max="200" step="1"></div>
          <div class="col-6"><label>난류 시그마 (turb_sig)</label><input type="number" id="turb_sig" min="0" max="5" step="0.01"></div>
          <div class="col-6"><label>열기포 세기 (therm_str)</label><input type="number" id="therm_str" min="0" max="5" step="0.01"></div>
          <div class="col-6"><label>열기포 반경 (therm_rad)</label><input type="number" id="therm_rad" min="0" max="100" step="1"></div>
        </div>
      </section>

      <!-- 타이밍 -->
      <section class="card col-12">
        <div class="row">
          <strong class="section-title">타이밍 (TIMING)</strong>
          <div class="right tight"><button class="btn ok" id="btnSaveTiming">타이밍 저장</button></div>
        </div>
        <div class="grid">
          <div class="col-4"><label>시뮬 간격(ms)</label><input type="number" id="sim_int" min="10" step="1"></div>
          <div class="col-4"><label>돌풍 체크(ms)</label><input type="number" id="gust_int" min="10" step="1"></div>
          <div class="col-4"><label>열기포 체크(ms)</label><input type="number" id="thermal_int" min="10" step="1"></div>
        </div>
      </section>

      <!-- Wi-Fi AP -->
      <section class="card col-12">
        <div class="row">
          <strong class="section-title">Wi-Fi (AP 설정)</strong>
          <div class="right tight"><button class="btn ok" id="btnSaveWifiAP">AP 저장</button></div>
        </div>
        <div class="grid">
          <div class="col-4">
            <label>Wi-Fi 모드</label>
            <select id="wifi_mode">
              <option value="0">AP</option>
              <option value="1">STA</option>
              <option value="2">AP+STA</option>
            </select>
          </div>
          <div class="col-4"><label>AP SSID</label><input id="ap_ssid"></div>
          <div class="col-4"><label>AP Password</label><input id="ap_password" type="password"></div>
        </div>
      </section>

      <!-- Wi-Fi STA -->
      <section class="card col-12">
        <div class="row">
          <strong class="section-title">Wi-Fi (STA 목록)</strong>
          <div class="right tight">
            <button class="btn" id="btnScan">스캔</button>
            <button class="btn ok" id="btnSaveWifiSTA">STA 저장</button>
          </div>
        </div>
        <div class="grid">
          <div class="col-12"><div class="list" id="staList"></div></div>
          <div class="col-12">
            <div class="row tight">
              <select id="scanList" class="fill"></select>
              <input id="scanPass" type="password" placeholder="선택 SSID 비밀번호">
              <button class="btn" id="btnUseScan">추가</button>
            </div>
          </div>
        </div>
      </section>

      <!-- PWM -->
      <section class="card col-12">
        <div class="row">
          <strong class="section-title">PWM 하드웨어</strong>
          <div class="right tight"><button class="btn ok" id="btnSavePWM">PWM 저장</button></div>
        </div>
        <div class="grid mt16">
          <div class="col-3"><label>PWM GPIO</label><input type="number" id="pwm_pin" min="0" max="48"></div>
          <div class="col-3"><label>채널</label><input type="number" id="pwm_channel" min="0" max="7"></div>
          <div class="col-3"><label>주파수(Hz)</label><input type="number" id="pwm_freq" min="25000" max="40000" step="500"></div>
          <div class="col-3"><label>해상도(bits)</label><input type="number" id="pwm_res" min="8" max="16"></div>
        </div>
      </section>

      <!-- 보안 -->
      <section class="card col-12">
        <div class="row">
          <strong class="section-title">보안(API Key)</strong>
          <div class="right tight"><button class="btn ok" id="btnSaveApiKey">API Key 저장</button></div>
        </div>
        <div class="grid mt8">
          <div class="col-12">
            <input id="apiKeyInput" type="password" placeholder="Key 입력 또는 새 Key 설정">
            <small class="muted">브라우저 로컬에 저장됨, 요청시 X-API-Key로 전송</small>
          </div>
        </div>
      </section>

      <!-- 파일 업로드 -->
      <section class="card col-12">
        <strong class="section-title">파일 업로드 / 펌웨어 OTA</strong>
        <div class="grid">
          <div class="col-6">
            <label>정적 파일 업로드</label>
            <div class="row tight">
              <input type="file" id="fileUpload" />
              <button class="btn ok" id="btnUploadStatic">업로드</button>
            </div>
            <div id="uploadMsg" class="mt8 muted"></div>
          </div>
          <div class="col-6">
            <label>펌웨어 OTA 업데이트</label>
            <div class="row tight">
              <input type="file" id="fileOTA" />
              <button class="btn ok" id="btnUploadOTA">업데이트</button>
            </div>
            <div id="otaMsg" class="mt8 muted"></div>
          </div>
        </div>
      </section>
    </div>

    <div class="hr"></div>
    <div class="muted">© 2540.kr SmartNatureWind</div>
  </div>

  <div id="loadingOverlay"><div class="spinner"></div></div>
  <div id="toastContainer"></div>

  <script src="./SC10_main_017.js" defer></script>
</body>
</html>
